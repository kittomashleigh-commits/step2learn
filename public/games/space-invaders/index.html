<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Defender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #050508;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }
    .hud {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .hud-title { font-size: 18px; font-weight: 800; color: #a855f7; letter-spacing: 1px; }
    .stats { display: flex; gap: 12px; }
    .badge {
      background: #12101e;
      border: 1px solid #2e1065;
      border-radius: 6px;
      padding: 4px 10px;
      text-align: center;
    }
    .badge-label { font-size: 9px; text-transform: uppercase; color: #c084fc; }
    .badge-val { font-size: 16px; font-weight: 700; color: #f3e8ff; font-variant-numeric: tabular-nums; }
    .game-box {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      background: #0a0814;
      border: 2px solid #3b0764;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 8, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 28px; font-weight: 800; color: #a855f7; }
    .btn {
      background: #9333ea;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .hint { margin-top: 8px; font-size: 12px; color: #7e22ce; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">SPACE DEFENDER</div>
    <div class="stats">
      <div class="badge">
        <div class="badge-label">Score</div>
        <div class="badge-val" id="score">0</div>
      </div>
      <div class="badge">
        <div class="badge-label">Shields</div>
        <div class="badge-val" id="lives">3</div>
      </div>
      <div class="badge">
        <div class="badge-label">Wave</div>
        <div class="badge-val" id="wave">1</div>
      </div>
    </div>
  </div>

  <div class="game-box">
    <canvas id="canvas" width="480" height="360"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="msg">DEFEND EARTH</h2>
      <button class="btn" id="start-btn">Engage Defense</button>
    </div>
  </div>
  <div class="hint">Left/Right or A/D to steer, Spacebar to fire plasma cannon</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const waveEl = document.getElementById('wave');
    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');
    const startBtn = document.getElementById('start-btn');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, dur = 0.05, type = 'square') {
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    let player = { x: 220, y: 325, w: 28, h: 16, speed: 5 };
    let bullets = [];
    let alienBullets = [];
    let aliens = [];
    let alienDir = 1;
    let alienStepDown = false;
    let alienSpeed = 1;
    let score = 0;
    let lives = 3;
    let wave = 1;
    let isPlaying = false;
    let left = false, right = false, fire = false;
    let lastFireTime = 0;

    // Stars background
    const stars = Array.from({ length: 60 }, () => ({
      x: Math.random() * 480,
      y: Math.random() * 360,
      speed: Math.random() * 0.8 + 0.2
    }));

    function initAliens() {
      aliens = [];
      const cols = 8;
      const rows = 4;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          aliens.push({
            x: 60 + c * 42,
            y: 40 + r * 28,
            w: 24,
            h: 18,
            alive: true,
            pts: (4 - r) * 10,
            type: r
          });
        }
      }
      alienDir = 1;
      alienSpeed = 1 + (wave - 1) * 0.3;
    }

    function start() {
      if (lives <= 0) {
        score = 0;
        lives = 3;
        wave = 1;
        scoreEl.textContent = '0';
        livesEl.textContent = '3';
        waveEl.textContent = '1';
      }
      player.x = 220;
      bullets = [];
      alienBullets = [];
      initAliens();
      overlay.classList.add('hidden');
      isPlaying = true;
    }

    function gameOver() {
      isPlaying = false;
      beep(120, 0.5, 'sawtooth');
      msg.textContent = 'DEFENSE FAILED';
      startBtn.textContent = 'Re-deploy';
      overlay.classList.remove('hidden');
    }

    function waveCleared() {
      wave++;
      waveEl.textContent = wave;
      score += 200;
      scoreEl.textContent = score;
      beep(600, 0.2);
      initAliens();
    }

    function update() {
      // Starfield
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > 360) s.y = 0;
      });

      if (!isPlaying) return;

      if (left && player.x > 10) player.x -= player.speed;
      if (right && player.x + player.w < canvas.width - 10) player.x += player.speed;

      if (fire && performance.now() - lastFireTime > 250) {
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y - 4, w: 4, h: 10 });
        beep(580, 0.04);
        lastFireTime = performance.now();
      }

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= 7;
        if (b.y < -10) { bullets.splice(i, 1); continue; }

        for (let j = 0; j < aliens.length; j++) {
          const a = aliens[j];
          if (a.alive && b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) {
            a.alive = false;
            bullets.splice(i, 1);
            score += a.pts;
            scoreEl.textContent = score;
            beep(750, 0.08, 'sawtooth');
            break;
          }
        }
      }

      // Alien Movement
      let edgeHit = false;
      let aliveCount = 0;
      aliens.forEach(a => {
        if (!a.alive) return;
        aliveCount++;
        a.x += alienDir * alienSpeed;
        if (a.x + a.w > canvas.width - 15 || a.x < 15) edgeHit = true;
      });

      if (edgeHit) {
        alienDir = -alienDir;
        aliens.forEach(a => {
          if (a.alive) {
            a.y += 12;
            if (a.y + a.h >= player.y) gameOver();
          }
        });
      }

      if (aliveCount === 0) waveCleared();

      // Alien Shooting
      if (Math.random() < 0.03 && aliveCount > 0) {
        const living = aliens.filter(a => a.alive);
        const shooter = living[Math.floor(Math.random() * living.length)];
        alienBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, w: 3, h: 8 });
      }

      // Alien Bullets
      for (let i = alienBullets.length - 1; i >= 0; i--) {
        const ab = alienBullets[i];
        ab.y += 4;
        if (ab.y > canvas.height + 10) { alienBullets.splice(i, 1); continue; }

        if (ab.x > player.x && ab.x < player.x + player.w && ab.y > player.y && ab.y < player.y + player.h) {
          alienBullets.splice(i, 1);
          lives--;
          livesEl.textContent = lives;
          beep(200, 0.3, 'sawtooth');
          if (lives <= 0) gameOver();
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#0a0814';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#6b7280';
      stars.forEach(s => ctx.fillRect(s.x, s.y, 1.5, 1.5));

      // Player Ship
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.closePath();
      ctx.fill();

      // Player Lasers
      ctx.fillStyle = '#f43f5e';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Alien Lasers
      ctx.fillStyle = '#a855f7';
      alienBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Aliens
      const alienColors = ['#f43f5e', '#fb923c', '#eab308', '#4ade80'];
      aliens.forEach(a => {
        if (!a.alive) return;
        ctx.fillStyle = alienColors[a.type % 4];
        ctx.fillRect(a.x + 3, a.y, a.w - 6, a.h);
        ctx.fillRect(a.x, a.y + 4, a.w, a.h - 8);
        ctx.fillStyle = '#050508';
        ctx.fillRect(a.x + 4, a.y + 5, 3, 3);
        ctx.fillRect(a.x + a.w - 7, a.y + 5, 3, 3);
      });

      update();
      requestAnimationFrame(draw);
    }

    window.addEventListener('keydown', e => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) left = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) right = true;
      if (e.code === 'Space') { e.preventDefault(); fire = true; }
    });
    window.addEventListener('keyup', e => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) right = false;
      if (e.code === 'Space') fire = false;
    });

    startBtn.addEventListener('click', start);
    initAliens();
    draw();
  </script>
</body>
</html>
