<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }
    .hud {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .hud-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats {
      display: flex;
      gap: 12px;
    }
    .stat-badge {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 6px;
      padding: 4px 10px;
      text-align: center;
    }
    .stat-name { font-size: 9px; text-transform: uppercase; color: #9ca3af; }
    .stat-val { font-size: 16px; font-weight: 700; color: #34d399; font-variant-numeric: tabular-nums; }
    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1;
      background: #030712;
      border: 2px solid #1f2937;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 28px; font-weight: 800; color: #f9fafb; }
    .btn {
      background: #10b981;
      color: #030712;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .controls-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">
      <span>RETRO SNAKE</span>
    </div>
    <div class="stats">
      <div class="stat-badge">
        <div class="stat-name">Score</div>
        <div class="stat-val" id="score">0</div>
      </div>
      <div class="stat-badge">
        <div class="stat-name">Length</div>
        <div class="stat-val" id="length">3</div>
      </div>
      <div class="stat-badge">
        <div class="stat-name">Best</div>
        <div class="stat-val" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="game-canvas" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Ready to Slither?</h2>
      <p style="color: #9ca3af; font-size: 13px;" id="overlay-subtitle">Press arrow keys or click Start</p>
      <button class="btn" id="start-btn">Start Game</button>
    </div>
  </div>

  <div class="controls-hint">Use Arrow keys or WASD to navigate snake</div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const lengthEl = document.getElementById('length');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySubtitle = document.getElementById('overlay-subtitle');
    const startBtn = document.getElementById('start-btn');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, time, type = 'sine') {
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + time);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + time);
      } catch(e) {}
    }

    const GRID = 20;
    const TILES = 20;
    let snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
    let dir = { x: 0, y: -1 };
    let nextDir = { x: 0, y: -1 };
    let food = { x: 5, y: 5, golden: false };
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('snake_best') || '0', 10);
    bestEl.textContent = bestScore;
    let gameLoop = null;
    let isRunning = false;

    function spawnFood() {
      const isGolden = Math.random() < 0.2;
      let newFood;
      while (true) {
        newFood = {
          x: Math.floor(Math.random() * TILES),
          y: Math.floor(Math.random() * TILES),
          golden: isGolden
        };
        const collide = snake.some(s => s.x === newFood.x && s.y === newFood.y);
        if (!collide) break;
      }
      food = newFood;
    }

    function startGame() {
      snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
      dir = { x: 0, y: -1 };
      nextDir = { x: 0, y: -1 };
      score = 0;
      scoreEl.textContent = '0';
      lengthEl.textContent = '3';
      spawnFood();
      overlay.classList.add('hidden');
      isRunning = true;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      beep(150, 0.4, 'sawtooth');
      overlayTitle.textContent = 'Game Over!';
      overlaySubtitle.textContent = `Score: ${score} · High Score: ${bestScore}`;
      startBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
    }

    function update() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= TILES || head.y < 0 || head.y >= TILES) {
        return gameOver();
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // Food collision
      if (head.x === food.x && head.y === food.y) {
        const pts = food.golden ? 50 : 10;
        score += pts;
        scoreEl.textContent = score;
        lengthEl.textContent = snake.length;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('snake_best', bestScore);
          bestEl.textContent = bestScore;
        }
        beep(food.golden ? 880 : 540, 0.12);
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 1;
      for (let i = 0; i < TILES; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0);
        ctx.lineTo(i * GRID, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID);
        ctx.lineTo(canvas.width, i * GRID);
        ctx.stroke();
      }

      // Draw Food
      ctx.save();
      if (food.golden) {
        ctx.fillStyle = '#facc15';
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 10;
      } else {
        ctx.fillStyle = '#f43f5e';
        ctx.shadowColor = '#f43f5e';
        ctx.shadowBlur = 8;
      }
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw Snake
      snake.forEach((seg, idx) => {
        const isHead = idx === 0;
        ctx.fillStyle = isHead ? '#34d399' : '#10b981';
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = isHead ? 6 : 0;
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);

        if (isHead) {
          ctx.fillStyle = '#042f2e';
          // Eye dots
          ctx.fillRect(seg.x * GRID + 5, seg.y * GRID + 5, 3, 3);
          ctx.fillRect(seg.x * GRID + 12, seg.y * GRID + 5, 3, 3);
        }
      });
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code) && dir.y !== 1) {
        e.preventDefault(); nextDir = { x: 0, y: -1 };
        if (!isRunning) startGame();
      } else if (['ArrowDown', 'KeyS'].includes(e.code) && dir.y !== -1) {
        e.preventDefault(); nextDir = { x: 0, y: 1 };
        if (!isRunning) startGame();
      } else if (['ArrowLeft', 'KeyA'].includes(e.code) && dir.x !== 1) {
        e.preventDefault(); nextDir = { x: -1, y: 0 };
        if (!isRunning) startGame();
      } else if (['ArrowRight', 'KeyD'].includes(e.code) && dir.x !== -1) {
        e.preventDefault(); nextDir = { x: 1, y: 0 };
        if (!isRunning) startGame();
      }
    });

    // Touch swipe support
    let touchX = 0, touchY = 0;
    canvas.addEventListener('touchstart', e => {
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    }, { passive: true });
    canvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > 25 || Math.abs(dy) > 25) {
        if (!isRunning) startGame();
        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 0 && dir.x !== -1) nextDir = { x: 1, y: 0 };
          else if (dx < 0 && dir.x !== 1) nextDir = { x: -1, y: 0 };
        } else {
          if (dy > 0 && dir.y !== -1) nextDir = { x: 0, y: 1 };
          else if (dy < 0 && dir.y !== 1) nextDir = { x: 0, y: -1 };
        }
      }
    }, { passive: true });

    startBtn.addEventListener('click', startGame);
    draw();
  </script>
</body>
</html>
