<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Flight</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }
    .game-box {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 9/16;
      max-height: 90vh;
      background: #38bdf8;
      border: 3px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
    }
    .score-text {
      font-size: 48px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 3px 6px rgba(0,0,0,0.4), 0 0 10px rgba(0,0,0,0.2);
      font-variant-numeric: tabular-nums;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      backdrop-filter: blur(2px);
    }
    .overlay.hidden { display: none; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 20px 24px;
      border-radius: 12px;
      text-align: center;
      width: 80%;
    }
    .card h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #f8fafc; }
    .stat-row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 14px; color: #94a3b8; }
    .stat-row span:last-child { font-weight: 700; color: #facc15; }
    .btn {
      background: #eab308;
      color: #422006;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="game-box" id="game-container">
    <canvas id="flappy" width="320" height="480"></canvas>
    <div class="hud">
      <div class="score-text" id="score">0</div>
    </div>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="modal-title">FLAPPY FLIGHT</h2>
        <div class="stat-row">
          <span>Score</span>
          <span id="end-score">0</span>
        </div>
        <div class="stat-row">
          <span>Best Score</span>
          <span id="best-score">0</span>
        </div>
        <button class="btn" id="play-btn">Tap to Fly</button>
      </div>
    </div>
  </div>
  <div class="hint">Spacebar, click, or tap screen to flap wings</div>

  <script>
    const canvas = document.getElementById('flappy');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const modalTitle = document.getElementById('modal-title');
    const endScoreEl = document.getElementById('end-score');
    const bestScoreEl = document.getElementById('best-score');
    const playBtn = document.getElementById('play-btn');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sfx(freq, dur = 0.08) {
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    let bird = { x: 60, y: 200, vy: 0, r: 12 };
    let pipes = [];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    bestScoreEl.textContent = bestScore;
    let isPlaying = false;
    let animId = null;
    let frame = 0;

    const GRAVITY = 0.38;
    const JUMP = -6.5;
    const GAP = 110;
    const PIPE_SPEED = 2.4;

    function reset() {
      bird = { x: 60, y: 200, vy: 0, r: 12 };
      pipes = [];
      score = 0;
      frame = 0;
      scoreEl.textContent = '0';
      overlay.classList.add('hidden');
      isPlaying = true;
    }

    function flap() {
      if (!isPlaying) {
        reset();
      }
      bird.vy = JUMP;
      sfx(400);
    }

    function gameOver() {
      isPlaying = false;
      sfx(160, 0.3);
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('flappy_best', bestScore);
      }
      modalTitle.textContent = 'GAME OVER';
      endScoreEl.textContent = score;
      bestScoreEl.textContent = bestScore;
      playBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
    }

    function spawnPipe() {
      const topHeight = Math.floor(Math.random() * (canvas.height - GAP - 120)) + 40;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + GAP,
        passed: false
      });
    }

    function loop() {
      frame++;
      // Background sky
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.beginPath();
      ctx.arc(80, 80, 30, 0, Math.PI * 2);
      ctx.arc(110, 70, 40, 0, Math.PI * 2);
      ctx.arc(140, 80, 30, 0, Math.PI * 2);
      ctx.fill();

      // Ground
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 10);
      ctx.fillStyle = '#ca8a04';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

      if (isPlaying) {
        bird.vy += GRAVITY;
        bird.y += bird.vy;

        // Ground / Ceiling hit
        if (bird.y + bird.r >= canvas.height - 40 || bird.y - bird.r <= 0) {
          gameOver();
        }

        // Spawn pipes
        if (frame % 90 === 0) spawnPipe();

        // Pipes update & draw
        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= PIPE_SPEED;

          // Collision with pipe
          if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + 50) {
            if (bird.y - bird.r < p.top || bird.y + bird.r > p.bottom) {
              gameOver();
            }
          }

          // Score pass
          if (!p.passed && p.x + 50 < bird.x) {
            p.passed = true;
            score++;
            scoreEl.textContent = score;
            sfx(620);
          }

          if (p.x < -60) pipes.splice(i, 1);
        }
      }

      // Draw Pipes
      pipes.forEach(p => {
        // Top pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, 0, 50, p.top);
        ctx.fillStyle = '#15803d';
        ctx.fillRect(p.x - 3, p.top - 16, 56, 16);

        // Bottom pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, p.bottom, 50, canvas.height - p.bottom - 40);
        ctx.fillStyle = '#15803d';
        ctx.fillRect(p.x - 3, p.bottom, 56, 16);
      });

      // Draw Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.vy / 10)));
      ctx.rotate(angle);

      // Bird body
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#eab308';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(4, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(6, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(8, -1);
      ctx.lineTo(16, 2);
      ctx.lineTo(8, 5);
      ctx.fill();

      ctx.restore();

      animId = requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      flap();
    });

    playBtn.addEventListener('click', () => {
      reset();
    });

    loop();
  </script>
</body>
</html>
